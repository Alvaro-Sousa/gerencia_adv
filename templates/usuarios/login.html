{% extends 'base.html' %}

{% block title %}Login | Gerencia Adv{% endblock %}

{% block content %}
<div class='row justify-content-center'>
    <div class='col-12 col-md-6 col-lg-4'>
        <div class='card shadow-sm border-0'>
            <div class='card-body p-4'>
                <h1 class='h4 mb-3 text-center'>Entrar</h1>

                <form method='post'>
                    {% csrf_token %}
                    <div class='mb-3'>
                        <label class='form-label'>E-mail</label>
                        <input type='email' class='form-control' name='email' placeholder='email@exemplo.com'>
                    </div>
                    <div class='mb-3'>
                        <label class='form-label'>Senha</label>
                        <input type='password' class='form-control' name='password' placeholder='Sua senha'>
                    </div>
                    <button type='submit' class='btn btn-primary w-100'>Entrar</button>
                </form> 
            </div>
        </div>
    </div>
</div>
{% endblock %}
